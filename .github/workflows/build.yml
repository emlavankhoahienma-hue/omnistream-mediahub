name: Build Unsigned IPA for Sideloading

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package Unsigned IPA
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          echo "Available Xcode installations:"
          ls -d /Applications/Xcode* || true

          if [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          elif [ -d "/Applications/Xcode_16.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.app
          elif [ -d "/Applications/Xcode.app" ]; then
            sudo xcode-select -s /Applications/Xcode.app
          else
            sudo xcode-select -s /Applications/Xcode_15.4.app
          fi

          xcodebuild -version

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Generate Xcode Project
        run: |
          xcodegen generate

      - name: Build App (Unsigned)
        run: |
          xcodebuild build \
            -project OmniStream.xcodeproj \
            -scheme OmniStream \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath "build/DerivedData" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_BITCODE=NO

      - name: Package Unsigned IPA for Sideload (TrollStore / AltStore / Scarlet)
        run: |
          mkdir -p build/Payload
          APP_PATH=$(find build/DerivedData/Build/Products -name "OmniStream.app" | head -n 1)
          echo "Found app at: $APP_PATH"
          cp -r "$APP_PATH" build/Payload/
          cd build
          zip -r "OmniStream-Unsigned.ipa" Payload
          ls -lh OmniStream-Unsigned.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OmniStream-Unsigned-IPA
          path: build/OmniStream-Unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v1.0.5 "build/OmniStream-Unsigned.ipa" \
            --title "OmniStream & MediaHub v1.0.5 (Real Video Pipeline & In-App Web Media Sniffer)" \
            --notes "## 🚀 OmniStream & MediaHub v1.0.5 - Cỗ Máy Tải Video Thật 100% & Trình Duyệt Bắt Link

          ### ⚡ Đột phá nâng cấp toàn diện:
          - 🌐 **Trình Duyệt Bắt Link Đa Nền Tảng (In-App Media Web Browser Sniffer)**: Tích hợp trình duyệt WebKit Liquid Glass với engine JavaScript Sniffer tự động bắt luồng video gốc khi xem trên **YouTube, TikTok, Facebook, Instagram, Twitter, các trang phim/anime, bóng đá, v.v.** Nổi ngay nút 'TẢI VIDEO NGAY (.mp4)' kèm haptic vibration khi phát video.
          - 🎬 **HLS Stream Downloader & Muxer (.m3u8)**: Tự động phân tích playlist m3u8, chọn luồng phân giải cao nhất, tải các phân mảnh (.ts) song song tốc độ cao và dùng AVAssetExportSession đóng gói lại thành file .mp4 chuẩn tương thích 100% với Photos / Camera Roll.
          - 🛡️ **Anti-HTML Guard & Magic Byte Verification**: Kiểm tra mã nhận diện 512-byte nhị phân và HTTP MIME. Ngăn chặn triệt để tình trạng tải nhầm file HTML 50KB giả video, bảo vệ kho phương tiện luôn sạch và chơi được 100%.
          - ⚡ **Hệ Thống Trích Xuất MediaStreamResolver**: Nhận diện thông minh OpenGraph video, HTML5 video tag và phân định chính xác giữa direct stream và trang web cần bắt luồng.
          - 📲 **Hiển thị & Chuyển đổi .ts**: Hỗ trợ định dạng Transport Stream (.ts) trong Thư Viện Media và Bộ Chuyển Đổi Định Dạng.

          ### 📲 Hướng dẫn cài đặt Sideload:
          - **TrollStore**: Tải file \`OmniStream-Unsigned.ipa\` đính kèm bên dưới và nhấn Cài đặt (Vĩnh viễn không thu hồi).
          - **AltStore / SideStore**: Thêm file \`OmniStream-Unsigned.ipa\` để ký bằng Apple ID cá nhân.
          - **Scarlet / Esign**: Cài đặt trực tiếp file \`OmniStream-Unsigned.ipa\` trên iPhone."
