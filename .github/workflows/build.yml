name: Build Unsigned IPA for Sideloading

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package Unsigned IPA
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Generate Xcode Project
        run: |
          xcodegen generate

      - name: Build App (Unsigned)
        run: |
          xcodebuild clean archive \
            -project OmniStream.xcodeproj \
            -scheme OmniStream \
            -destination "generic/platform=iOS" \
            -archivePath "build/OmniStream.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_BITCODE=NO \
            SWIFT_COMPILATION_MODE=wholemodule

      - name: Package Unsigned IPA for Sideload (TrollStore / AltStore / Scarlet)
        run: |
          mkdir -p build/Payload
          cp -r "build/OmniStream.xcarchive/Products/Applications/OmniStream.app" build/Payload/
          cd build
          zip -r "OmniStream-Unsigned.ipa" Payload
          ls -lh OmniStream-Unsigned.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OmniStream-Unsigned-IPA
          path: build/OmniStream-Unsigned.ipa
          if-no-files-found: error
          retention-days: 14
