name: Build Unsigned IPA for Sideloading

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package Unsigned IPA
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          echo "Available Xcode installations:"
          ls -d /Applications/Xcode* || true

          if [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          elif [ -d "/Applications/Xcode_16.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.app
          elif [ -d "/Applications/Xcode.app" ]; then
            sudo xcode-select -s /Applications/Xcode.app
          else
            sudo xcode-select -s /Applications/Xcode_15.4.app
          fi

          xcodebuild -version

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Generate Xcode Project
        run: |
          xcodegen generate

      - name: Build App (Unsigned)
        run: |
          xcodebuild build \
            -project OmniStream.xcodeproj \
            -scheme OmniStream \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath "build/DerivedData" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_BITCODE=NO

      - name: Package Unsigned IPA for Sideload (TrollStore / AltStore / Scarlet)
        run: |
          mkdir -p build/Payload
          APP_PATH=$(find build/DerivedData/Build/Products -name "OmniStream.app" | head -n 1)
          echo "Found app at: $APP_PATH"
          cp -r "$APP_PATH" build/Payload/
          cd build
          zip -r "OmniStream-Unsigned.ipa" Payload
          ls -lh OmniStream-Unsigned.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OmniStream-Unsigned-IPA
          path: build/OmniStream-Unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v1.0.2 "build/OmniStream-Unsigned.ipa" \
            --title "OmniStream & MediaHub v1.0.2 (Instant-Launch & Zero Freeze Edition)" \
            --notes "## 🚀 OmniStream & MediaHub v1.0.2 - Khắc phục triệt để đơ cảm ứng khi khởi động

          ### ⚡ Sửa lỗi quan trọng:
          - 🏎️ **Chạm bấm tức thì ngay khi mở app**: Chuyển toàn bộ tác vụ đọc \`UIPasteboard\` sang Background Utility Task, loại bỏ hoàn toàn hiện tượng nghẽn Main Runloop do IPC clipboard.
          - ⚡ **Loại bỏ tải trước AVAudioSession**: Không kích hoạt âm thanh sớm khi mở app, đảm bảo hệ thống phản hồi cảm ứng ngay từ mili-giây đầu tiên.
          - 💎 **Liquid Background CoreAnimation**: Chuyển gradient nền sang bộ tăng tốc phần cứng CoreAnimation 0% CPU, loại bỏ hoàn toàn đơ giao diện.
          - 📱 **Hỗ trợ toàn diện**: Tối ưu hiển thị mượt mà từ iPhone X đến iPhone 16 Pro Max.
          - ⚡ **Background Downloader**: Tải stream ngầm qua \`URLSessionDownloadDelegate\`, tính tốc độ và ETA.
          - 🎧 **Offline Transcoder**: Tách âm thanh M4A/AAC/WAV/MP3 (128/192/320kbps) & nén video HEVC/H.264.
          - 📂 **Files & Photos**: Tích hợp trực tiếp vào Cuộn Camera (Photos) và ứng dụng Files (\`UIFileSharingEnabled = true\`).

          ### 📲 Hướng dẫn cài đặt Sideload:
          - **TrollStore**: Tải file \`OmniStream-Unsigned.ipa\` đính kèm bên dưới và nhấn Cài đặt (Vĩnh viễn không thu hồi).
          - **AltStore / SideStore**: Thêm file \`OmniStream-Unsigned.ipa\` để ký bằng Apple ID cá nhân.
          - **Scarlet / Esign**: Cài đặt trực tiếp file \`OmniStream-Unsigned.ipa\` trên iPhone."
