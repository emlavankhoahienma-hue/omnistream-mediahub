name: Build Unsigned IPA for Sideloading

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package Unsigned IPA
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          echo "Available Xcode installations:"
          ls -d /Applications/Xcode* || true

          if [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          elif [ -d "/Applications/Xcode_16.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.app
          elif [ -d "/Applications/Xcode.app" ]; then
            sudo xcode-select -s /Applications/Xcode.app
          else
            sudo xcode-select -s /Applications/Xcode_15.4.app
          fi

          xcodebuild -version

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Generate Xcode Project
        run: |
          xcodegen generate

      - name: Build App (Unsigned)
        run: |
          xcodebuild build \
            -project OmniStream.xcodeproj \
            -scheme OmniStream \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath "build/DerivedData" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_BITCODE=NO

      - name: Package Unsigned IPA for Sideload (TrollStore / AltStore / Scarlet)
        run: |
          mkdir -p build/Payload
          APP_PATH=$(find build/DerivedData/Build/Products -name "OmniStream.app" | head -n 1)
          echo "Found app at: $APP_PATH"
          cp -r "$APP_PATH" build/Payload/
          cd build
          zip -r "OmniStream-Unsigned.ipa" Payload
          ls -lh OmniStream-Unsigned.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OmniStream-Unsigned-IPA
          path: build/OmniStream-Unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v1.0.4 "build/OmniStream-Unsigned.ipa" \
            --title "OmniStream & MediaHub v1.0.4 (Liquid Glass Transitions & Fluid UI Edition)" \
            --notes "## 🚀 OmniStream & MediaHub v1.0.4 - Hiệu ứng chuyển đổi chức năng Liquid Glass

          ### ⚡ Cải tiến đột phá:
          - 🌊 **Sliding Liquid Glass Tab Bar**: Bổ sung viên nang kính lỏng phát quang quang học trượt mượt mà theo tab được chọn với spring physics (\`matchedGeometryEffect\`). Biểu tượng tab phóng to tinh tế khi chọn.
          - 🎭 **Fluid View Transitions**: Chuyển đổi mượt mà giữa các chức năng (Tải Xuống, Chuyển Đổi, Thư Viện) dạng cross-dissolve kết hợp co giãn nhẹ, không còn giật khựng.
          - 🎛️ **Converter Fluid Mode Switcher**: Bộ chọn chế độ Tách Âm Thanh / Nén Video với viên nang kính tím-xanh trượt biến hình mềm mại và hiệu ứng trượt mờ cho thẻ cấu hình.
          - 🏷️ **Fluid Tag Filter Bar**: Viên nang kính xanh ngọc trôi mượt mà dưới nhãn danh mục đang chọn trong Kho Phương Tiện.
          - 🏎️ **Hiệu năng 120 FPS ProMotion**: Toàn bộ hiệu ứng được xử lý 100% bằng GPU Metal và SwiftUI declarative engine, 0% CPU overhead.

          ### 📲 Hướng dẫn cài đặt Sideload:
          - **TrollStore**: Tải file \`OmniStream-Unsigned.ipa\` đính kèm bên dưới và nhấn Cài đặt (Vĩnh viễn không thu hồi).
          - **AltStore / SideStore**: Thêm file \`OmniStream-Unsigned.ipa\` để ký bằng Apple ID cá nhân.
          - **Scarlet / Esign**: Cài đặt trực tiếp file \`OmniStream-Unsigned.ipa\` trên iPhone."
