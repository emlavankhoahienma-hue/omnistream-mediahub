name: Build Unsigned IPA for Sideloading

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package Unsigned IPA
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          echo "Available Xcode installations:"
          ls -d /Applications/Xcode* || true

          if [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          elif [ -d "/Applications/Xcode_16.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.app
          elif [ -d "/Applications/Xcode.app" ]; then
            sudo xcode-select -s /Applications/Xcode.app
          else
            sudo xcode-select -s /Applications/Xcode_15.4.app
          fi

          xcodebuild -version

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Generate Xcode Project
        run: |
          xcodegen generate

      - name: Build App (Unsigned)
        run: |
          xcodebuild build \
            -project OmniStream.xcodeproj \
            -scheme OmniStream \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath "build/DerivedData" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_BITCODE=NO

      - name: Package Unsigned IPA for Sideload (TrollStore / AltStore / Scarlet)
        run: |
          mkdir -p build/Payload
          APP_PATH=$(find build/DerivedData/Build/Products -name "OmniStream.app" | head -n 1)
          echo "Found app at: $APP_PATH"
          cp -r "$APP_PATH" build/Payload/
          cd build
          zip -r "OmniStream-Unsigned.ipa" Payload
          ls -lh OmniStream-Unsigned.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OmniStream-Unsigned-IPA
          path: build/OmniStream-Unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v1.0.3 "build/OmniStream-Unsigned.ipa" \
            --title "OmniStream & MediaHub v1.0.3 (Instant Touch & 120 FPS Metal Edition)" \
            --notes "## 🚀 OmniStream & MediaHub v1.0.3 - Khắc phục triệt để đơ lag khi vào app

          ### ⚡ Cải tiến đột phá:
          - 🏎️ **Chạm bấm tức thì 0ms latency**: Loại bỏ hoàn toàn việc đọc clipboard ngầm lúc khởi động app (vốn gây XPC deadlock với pasteboardd). Thao tác dán link chuyển về nút bấm chủ động, an toàn và nhạy tuyệt đối.
          - 💎 **Liquid Background Metal 0% CPU**: Tái cấu trúc nền gradient quang học đa tầng gia tốc trực tiếp qua GPU Metal. Loại bỏ hoàn toàn vòng lặp animation nặng nề và blendMode gây quá tải GPU/CPU.
          - 🎯 **Nâng cấp độ nhạy nút bấm toàn app**: Bổ sung \`contentShape(Rectangle())\` và \`PlainButtonStyle()\` cho toàn bộ Tab Bar, ô nhập URL, nút dán và danh sách tác vụ. Chạm bất kỳ đâu trên nút đều ăn lệnh ngay lập tức.
          - 🛡️ **Non-blocking Overlays**: Bổ sung \`allowsHitTesting(false)\` cho tất cả các lớp viền phản quang và khúc xạ trên LiquidGlass, loại bỏ hoàn toàn việc lớp phủ đồ họa chặn cảm ứng.
          - 🧩 **Tách biệt nút bấm trong Thư viện**: Tách biệt hoàn toàn vùng bấm phát media và nút Menu / Sao, loại bỏ xung đột cử chỉ.

          ### 📲 Hướng dẫn cài đặt Sideload:
          - **TrollStore**: Tải file \`OmniStream-Unsigned.ipa\` đính kèm bên dưới và nhấn Cài đặt (Vĩnh viễn không thu hồi).
          - **AltStore / SideStore**: Thêm file \`OmniStream-Unsigned.ipa\` để ký bằng Apple ID cá nhân.
          - **Scarlet / Esign**: Cài đặt trực tiếp file \`OmniStream-Unsigned.ipa\` trên iPhone."
