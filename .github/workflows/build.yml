name: Build Unsigned IPA for Sideloading

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package Unsigned IPA
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          echo "Available Xcode installations:"
          ls -d /Applications/Xcode* || true

          if [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          elif [ -d "/Applications/Xcode_16.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.app
          elif [ -d "/Applications/Xcode.app" ]; then
            sudo xcode-select -s /Applications/Xcode.app
          else
            sudo xcode-select -s /Applications/Xcode_15.4.app
          fi

          xcodebuild -version

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Generate Xcode Project
        run: |
          xcodegen generate

      - name: Build App (Unsigned)
        run: |
          xcodebuild build \
            -project OmniStream.xcodeproj \
            -scheme OmniStream \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath "build/DerivedData" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_BITCODE=NO

      - name: Package Unsigned IPA for Sideload (TrollStore / AltStore / Scarlet)
        run: |
          mkdir -p build/Payload
          APP_PATH=$(find build/DerivedData/Build/Products -name "OmniStream.app" | head -n 1)
          echo "Found app at: $APP_PATH"
          cp -r "$APP_PATH" build/Payload/
          cd build
          zip -r "OmniStream-Unsigned.ipa" Payload
          ls -lh OmniStream-Unsigned.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OmniStream-Unsigned-IPA
          path: build/OmniStream-Unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v1.0.6 "build/OmniStream-Unsigned.ipa" \
            --title "OmniStream & MediaHub v1.0.6 (Hotfix: Compact Liquid Glass Tab Bar & Sizing Fix)" \
            --notes "## 🚀 OmniStream & MediaHub v1.0.6 - Sửa Lỗi Giao Diện Tab Bar To Chiếm Màn Hình

          ### ⚡ Sửa lỗi quan trọng (Hotfix):
          - 🎯 **Khắc phục lỗi Tab Bar khổng lồ chiếm toàn màn hình**: Cố định kích thước chiều cao chuẩn 60pt cho thanh điều hướng Liquid Glass Tab Bar và 50pt cho viên nang kính lỏng chuyển động. Tab bar giờ đây nhỏ gọn, thanh thoát, nằm chuẩn xác ở đáy màn hình và không còn che khuất nội dung.
          - 📏 **Chuẩn hóa kích thước các bộ chọn (Mode Selector & Tag Filter Bar)**: Thêm giới hạn chiều cao cố định cho các viên nang chọn chế độ (Transcode Studio) và thanh lọc danh mục (Kho Phương Tiện), ngăn ngừa hiện tượng co giãn không mong muốn trên các dòng iPhone có màn hình khác nhau.
          - 🌐 **Duy trì đầy đủ tính năng v1.0.5**: Trình Duyệt Bắt Link Đa Nền Tảng (YouTube/TikTok/Facebook), Tải & Ghép Luồng HLS .m3u8 sang .mp4, và Hàng rào Anti-HTML Guard.

          ### 📲 Hướng dẫn cài đặt Sideload:
          - **TrollStore**: Tải file \`OmniStream-Unsigned.ipa\` đính kèm bên dưới và nhấn Cài đặt (Vĩnh viễn không thu hồi).
          - **AltStore / SideStore**: Thêm file \`OmniStream-Unsigned.ipa\` để ký bằng Apple ID cá nhân.
          - **Scarlet / Esign**: Cài đặt trực tiếp file \`OmniStream-Unsigned.ipa\` trên iPhone."
