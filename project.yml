name: OmniStream
options:
  bundleIdPrefix: com.omnistream
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"
  defaultConfig: Release
settings:
  SWIFT_VERSION: "5.9"
  IPHONEOS_DEPLOYMENT_TARGET: "16.0"
  DEVELOPMENT_TEAM: ""
  CODE_SIGN_IDENTITY: ""
  CODE_SIGNING_REQUIRED: "NO"
  CODE_SIGNING_ALLOWED: "NO"
  TARGETED_DEVICE_FAMILY: "1,2"
  ENABLE_BITCODE: "NO"

targets:
  OmniStream:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: OmniStream
    info:
      path: OmniStream/App/Info.plist
      properties:
        CFBundleDisplayName: "OmniStream"
        CFBundleShortVersionString: "1.0.1"
        CFBundleVersion: "2"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.omnistream.mediahub
      INFOPLIST_FILE: OmniStream/App/Info.plist
      GENERATE_INFOPLIST_FILE: NO
      ENABLE_PREVIEWS: YES
      CODE_SIGN_IDENTITY: ""
      CODE_SIGNING_REQUIRED: "NO"
      CODE_SIGNING_ALLOWED: "NO"
